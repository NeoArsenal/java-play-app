name: java_play_app
description: "Gamified Duolingo-style app for Java & Spring Boot technical interview preparation"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  http: ^1.2.2
  shared_preferences: ^2.2.3
  speech_to_text: ^7.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/branding/app_icon.png"

flutter_native_splash:
  color: "#58CC02"
  image: assets/branding/app_icon.png
  android_12:
    color: "#58CC02"
    image: assets/branding/app_icon.png

flutter:
  uses-material-design: true
  assets:
    - assets/data/curriculum.json
    - assets/branding/app_icon.png
